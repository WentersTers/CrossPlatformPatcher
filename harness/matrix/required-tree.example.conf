# required-tree.example.conf — GENERIC SCHEMA (public).
#
# The real inventory file carries product identifiers and lives in the
# PRIVATE research repo (see docs/REPO-PUBLISHING.md). Use this schema to
# produce your local copy:
#   cp required-tree.example.conf required-tree.conf   (gitignored)
# or point the loader at any path:
#   export REQUIRED_TREE_CONF=/path/to/required-tree.conf
#
# Enforced by common.sh:verify_app_tree (host) and verify_guest_tree (guest).
# A leg that fails verification is VOID-STAGING, not a verdict.
#
# format: dir|<relative-content-dir>|<min-file-count>
#         file|<relative-core-file>|<min-bytes>
# The real program / patch target entry is mandatory in the real file.

dir|<content-dir-a>|<min-files>
dir|<content-dir-b>|<min-files>
file|<real-program-entrypoint>|<min-bytes>
file|<core-runtime-dll-a>|<min-bytes>
